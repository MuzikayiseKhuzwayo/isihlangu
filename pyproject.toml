[project]
name = "isihlangu"
version = "0.1.0"
description = "Deterministic Agentic SaaS Security Evaluation and Testing Harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Isihlangu Security Core Team" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.28",
    "jsonschema>=4.21.1",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[project.scripts]
isihlangu = "isihlangu.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isihlangu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
